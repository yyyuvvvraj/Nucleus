services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    networks:
      - nucleus-network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  voice-service:
    container_name: voice-service
    build: ./voice-auth-service
    ports:
      - "8000:8000"
    networks:
      - nucleus-network
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    container_name: backend
    build: ./backend
    ports:
      - "5050:5001"
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/nucleus}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - VOICE_SERVICE_URL=http://voice-service:8000
    networks:
      - nucleus-network
    depends_on:
      mongodb:
        condition: service_healthy
      voice-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # This new service handles seeding automatically!
  db-seed:
    build: ./backend
    container_name: db-seed
    networks:
      - nucleus-network
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/nucleus}
    command: ["node", "scripts/seed.js"]
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    container_name: frontend
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5050
    ports:
      - "3000:80"
    networks:
      - nucleus-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  nucleus-network:
    driver: bridge

volumes:
  mongo-data:
