services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    networks:
      - nucleus-network
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  voice-service:
    container_name: voice-service
    build: ./voice-auth-service
    ports:
      - "8000:8000"
    networks:
      - nucleus-network
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    container_name: backend
    build: ./backend
    ports:
      - "5050:5001"
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/nucleus}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - VOICE_SERVICE_URL=http://voice-service:8000
    networks:
      - nucleus-network
    depends_on:
      mongodb:
        condition: service_healthy
      voice-service:
        condition: service_started

  # This new service handles seeding automatically!
  db-seed:
    build: ./backend
    container_name: db-seed
    networks:
      - nucleus-network
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/nucleus}
    command: ["node", "scripts/seed.js"]
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    container_name: frontend
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5050
    ports:
      - "3000:80"
    networks:
      - nucleus-network
    depends_on:
      - backend

networks:
  nucleus-network:
    driver: bridge

volumes:
  mongo-data:
